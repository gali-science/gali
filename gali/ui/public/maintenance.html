<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf7" />
    <meta name="robots" content="noindex" />
    <title>Gali — We’ll be back soon</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: "Jost";
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/jost-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #251d19;
        background:
          radial-gradient(circle at 18% 18%, #ffdccd 0, transparent 34%),
          radial-gradient(circle at 82% 76%, #ede4fc 0, transparent 38%),
          #fffaf7;
        font-family: "Jost", system-ui, sans-serif;
      }

      main {
        width: min(640px, 100%);
        text-align: center;
        animation: arrive 500ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .mark {
        margin-bottom: 28px;
        color: #fc4c02;
        font-size: 48px;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 8vw, 78px);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      p {
        max-width: 34ch;
        margin: 22px auto 0;
        color: #6e625c;
        font-size: clamp(17px, 2.5vw, 20px);
        line-height: 1.5;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>We’ll be back soon.</h1>
      <p>Gali is briefly offline while we make a few improvements.</p>
    </main>
  </body>
</html>
